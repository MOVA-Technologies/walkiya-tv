name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q walkiya-tv-stage1.zip -x "walkiya-tv/.github/*"
          cp -r walkiya-tv/. .
          rm -rf walkiya-tv walkiya-tv-stage1.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Stage 1 files"
          git push
